<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="menu-screen" class="screen" hidden>
      <h1 class="screen__title">Petri</h1>
      <p class="screen__instructions">Move with your cursor. Eat smaller cells. Avoid bigger ones.</p>
      <!-- One button per src/ui/adapter/dom/menu.adapter.ts's ARENA_SIZES entry, same order —
           labeled with the arena's actual width (not an abstract tier name like the original
           three's Small/Medium/Large, which doesn't scale cleanly to ten options). -->
      <div class="size-picker" role="group" aria-label="Arena size">
        <button id="menu-size-0" type="button" class="size-picker__button size-picker__button--active">1000</button>
        <button id="menu-size-1" type="button" class="size-picker__button">1250</button>
        <button id="menu-size-2" type="button" class="size-picker__button">1500</button>
        <button id="menu-size-3" type="button" class="size-picker__button">1750</button>
        <button id="menu-size-4" type="button" class="size-picker__button">2000</button>
        <button id="menu-size-5" type="button" class="size-picker__button">2250</button>
        <button id="menu-size-6" type="button" class="size-picker__button">2500</button>
        <button id="menu-size-7" type="button" class="size-picker__button">2750</button>
        <button id="menu-size-8" type="button" class="size-picker__button">3000</button>
        <button id="menu-size-9" type="button" class="size-picker__button">3250</button>
      </div>
      <button id="menu-play-button" type="button" class="screen__button">Play</button>
      <button id="menu-settings-button" type="button" class="screen__button screen__button--secondary">Settings</button>
    </div>

    <div id="settings-screen" class="screen" hidden>
      <h1 class="screen__title">Settings</h1>
      <div class="settings-row">
        <label class="settings-row__label" for="settings-sfx-volume">SFX Volume</label>
        <input id="settings-sfx-volume" type="range" min="0" max="1" step="0.01" />
        <label class="settings-row__mute"><input id="settings-sfx-mute" type="checkbox" /> Mute</label>
      </div>
      <div class="settings-row">
        <label class="settings-row__label" for="settings-music-volume">Music Volume</label>
        <input id="settings-music-volume" type="range" min="0" max="1" step="0.01" />
        <label class="settings-row__mute"><input id="settings-music-mute" type="checkbox" /> Mute</label>
      </div>
      <button id="settings-back-button" type="button" class="screen__button screen__button--secondary">Back</button>
    </div>

    <div id="hud-overlay" class="hud" hidden>
      <span class="hud__label">Mass</span>
      <span id="hud-mass-value" class="hud__value">0</span>
    </div>

    <div id="game-over-screen" class="screen" hidden>
      <h1 class="screen__title">Game Over</h1>
      <p class="screen__score">Final mass: <span id="game-over-score-value">0</span></p>
      <button id="game-over-restart-button" type="button" class="screen__button">Restart</button>
      <button id="game-over-menu-button" type="button" class="screen__button screen__button--secondary">Main Menu</button>
    </div>

    <div id="victory-screen" class="screen" hidden>
      <h1 class="screen__title">You've consumed the entire dish!</h1>
      <p class="screen__score">Final mass: <span id="victory-score-value">0</span></p>
      <button id="victory-restart-button" type="button" class="screen__button">Restart</button>
      <button id="victory-menu-button" type="button" class="screen__button screen__button--secondary">Main Menu</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
